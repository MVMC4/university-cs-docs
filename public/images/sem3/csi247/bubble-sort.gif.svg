<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#grad3)"/>
  <text x="400" y="100" font-family="sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">
    Bubble Sort Animation
  </text>
  <text x="400" y="180" font-family="monospace" font-size="16" fill="#f72585" text-anchor="middle">
    Pass 1: [5, 3, 8, 4, 2] → [3, 5, 4, 2, 8]
  </text>
  <text x="400" y="220" font-family="monospace" font-size="16" fill="#4cc9f0" text-anchor="middle">
    Pass 2: [3, 5, 4, 2, 8] → [3, 4, 2, 5, 8]
  </text>
  <text x="400" y="260" font-family="monospace" font-size="14" fill="#fff" text-anchor="middle">
    ...continues until sorted
  </text>
  <rect x="220" y="310" width="360" height="45" rx="12" fill="#7209b7" opacity="0.5"/>
  <text x="400" y="338" font-family="sans-serif" font-size="11" fill="#fff" text-anchor="middle">
    Export screen recording as .gif for step-by-step animations
  </text>
</svg>
